[package]
name = "zzop-parser-typescript"
version.workspace = true
edition = "2021"
license.workspace = true
publish = false

[dependencies]
swc_core = { version = "71.0.5", features = ["ecma_parser", "ecma_ast", "ecma_visit", "common"] }
zzop-core = { path = "../../crates/core" }
# The SQL statement vocabulary (statement-shape gate, table extraction, db-table key casing) lives in
# ONE crate for both directions of the channel; `adapters/raw_sql` hands it strings, never regexes.
zzop-parser-sql = { path = "../parser-sql" }
regex = { workspace = true }

# tests/no_panic_proptest.rs — the arbitrary-input panic property every parser frontend carries.
[dev-dependencies]
proptest = { workspace = true }

# Inherit the workspace lint policy (root Cargo.toml [workspace.lints.clippy]) — every member does,
# with no exceptions. Where a single target legitimately violates one, the exemption is a crate-level
# #![allow] at that target's entry point, never a hole in this table.
[lints]
workspace = true
