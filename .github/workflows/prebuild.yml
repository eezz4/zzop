# Prebuild + release for the two Node-free binaries (`zzop` CLI from package `zzop-cli-bin` +
# `zzop-mcp` MCP server from package `zzop-mcp`, both thin binaries over the shared `zzop-summary` lib
# crate) and the 6-package npm distribution (5 `@zzop/cli-<platform>`
# sub-packages + `@zzop/cli`, published via npm OIDC "trusted publishing" — no NPM_TOKEN secret).
# `@zzop/cli` is a zero-logic shim that spawns the native `zzop` binary shipped in its own platform
# sub-packages. Runs on `workflow_dispatch`, a `v*` tag push, and every push to `main`.
#
# The `meta` job (first, needs nothing) decides whether a run releases and what version it releases:
# on a tag push it reads the tag and always releases; on a `main` push it reads the version SSOT —
# Cargo.toml's `[workspace.package] version` — and, unless `v<version>` already exists on the remote,
# creates and pushes that tag itself (autotagging). A `GITHUB_TOKEN` tag push does NOT retrigger
# workflows, so this SAME run continues on as the release — there is no second, competing run. If the
# tag already exists, the push is an ordinary build-only run (release=false). `workflow_dispatch` never
# releases. Every gate that used to read `startsWith(github.ref, 'refs/tags/v')` (verify-plugin-version,
# the MCPB per-platform version stamp, `release`, `publish`) now reads `needs.meta.outputs.release`, and
# every version that used to come from `GITHUB_REF_NAME` now comes from `needs.meta.outputs.version`.
# `meta` also checks `.claude-plugin/plugin.json`'s version against Cargo.toml BEFORE autotagging, so a
# forgotten plugin-version bump blocks the tag itself on the main-push path (the standalone
# verify-plugin-version job still re-checks it as a belt, covering the manual-tag path too).
#
# A release attaches the 5 platform `zzop`/`zzop-mcp` binaries PLUS per-platform MCPB (`.mcpb`) Desktop
# bundles to the GitHub release (job `release`) and separately publishes the npm packages (job
# `publish`) — two independent jobs that run alongside each other, not merged. See the mcp-distribution
# and version-autotagging decisions.
name: prebuild

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["main"]

# Two near-simultaneous main pushes must not race the autotag (both would read "tag absent" and
# push competing tags). Queue runs instead; never cancel a release mid-flight.
concurrency:
  group: prebuild-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Computes { release, version } for every downstream job/step to key off of, and — on an ordinary
  # `main` push whose Cargo.toml version isn't tagged yet — creates that tag so this run becomes the
  # release. Needs `contents: write` to push the tag.
  #
  # RECOVERY NOTE: after this job has pushed the tag, use "Re-run failed jobs" ONLY. "Re-run all
  # jobs" re-executes this gate, which now sees the tag already existing and downgrades the whole
  # run to build-only (release=false) — every release job silently skips. "Re-run failed jobs"
  # reuses this job's cached release=true/version outputs and retries just the failed jobs.
  meta:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.compute.outputs.release }}
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute release gate + version (autotags main pushes)
        id: compute
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Manual tag push: the tag itself is this run's version SSOT (current behavior).
            VERSION="${GITHUB_REF_NAME#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Tag push: releasing $VERSION (from $GITHUB_REF_NAME)."
          elif [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # main push: Cargo.toml [workspace.package] version is the SSOT. A forgotten
            # .claude-plugin/plugin.json bump blocks the autotag here, before any tag is created —
            # the standalone verify-plugin-version job re-checks this too (belt, covers manual tags).
            VERSION=$(grep -m1 '^version = "' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
            PLUGIN_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
            if [ "$PLUGIN_VERSION" != "$VERSION" ]; then
              echo "::error::.claude-plugin/plugin.json version ($PLUGIN_VERSION) does not match Cargo.toml [workspace.package] version ($VERSION) — bump .claude-plugin/plugin.json's \"version\" in the same commit that bumps the workspace version; a mismatch blocks the autotag."
              exit 1
            fi
            if jq -e 'has("version")' .claude-plugin/marketplace.json >/dev/null; then
              MARKETPLACE_VERSION=$(jq -r '.version' .claude-plugin/marketplace.json)
              if [ "$MARKETPLACE_VERSION" != "$VERSION" ]; then
                echo "::error::.claude-plugin/marketplace.json version ($MARKETPLACE_VERSION) does not match Cargo.toml [workspace.package] version ($VERSION) — a mismatch blocks the autotag."
                exit 1
              fi
            fi
            # server.json's versions too. `publish-mcp-registry` REWRITES every version/identifier/
            # fileSha256 at release time from the real assets, so the committed values never reach the
            # registry — but a human (or an agent) reading the repo sees them and takes them for the
            # shipped version. Keeping them honest costs one bump per release; leaving them stale cost a
            # dogfooding session (2026-07-24: committed 0.21.1 read as "the version", against 0.22.0
            # everywhere else). Only `version` is gated here: `fileSha256` genuinely cannot be known
            # before the assets exist, so the committed file declares NO fileSha256 at all rather than
            # a placeholder that reads as an integrity guarantee — scripts/check-server-json-hashes.sh
            # holds that line in pre-commit/CI, and its --stamped mode blocks the publish below.
            SERVER_VERSIONS=$(jq -r '[.version] + [.packages[].version] | unique | join(",")' server.json)
            if [ "$SERVER_VERSIONS" != "$VERSION" ]; then
              echo "::error::server.json declares version(s) [$SERVER_VERSIONS] but Cargo.toml [workspace.package] is $VERSION — bump server.json's top-level \"version\" and every packages[].version (and their download URLs) in the same commit; a mismatch blocks the autotag."
              exit 1
            fi
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            if [ -z "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
              git tag "v$VERSION"
              git push origin "refs/tags/v$VERSION"
              echo "release=true" >> "$GITHUB_OUTPUT"
              echo "Auto-tagged v$VERSION from main; this run continues on as the release."
            else
              echo "release=false" >> "$GITHUB_OUTPUT"
              echo "v$VERSION is already tagged; ordinary build-only main push."
            fi
          else
            # workflow_dispatch (or anything else): build-only, never releases. Cargo.toml's version
            # is still surfaced for log/debug purposes even though nothing downstream gates on it.
            VERSION=$(grep -m1 '^version = "' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch (or non-main/non-tag push): build-only, no release."
          fi

  build:
    strategy:
      fail-fast: false
      matrix:
        # `platform` names the zzop-mcp release asset (and the per-platform `.mcpb`), and doubles as
        # the npm/<platform> sub-package name (napi-rs/swc/Prisma convention, same mapping as
        # packages/cli/scripts/place-artifacts.mjs) for each target.
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            platform: win32-x64-msvc
          # Intel macOS: cross-compiled from the Apple Silicon runner (Intel `macos-13` runners are
          # scarce/deprecated). Same lane as linux-arm64 below — a secondary arch built on the primary
          # runner. The binary depends only on pure-workspace crates, so every cross lane builds with no
          # extra toolchain setup (only linux-arm64 needs a cross-linker, installed below).
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: "true"
            platform: darwin-x64
          - target: aarch64-apple-darwin
            os: macos-latest
            platform: darwin-arm64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux-x64-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: "true"
            platform: linux-arm64-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-compile linker (linux-arm64)
        # linux-arm64 alone needs a cross-linker; darwin-x64 cross-builds with the universal Apple SDK
        # on the arm64 runner and needs none.
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo 'CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc' >> "$GITHUB_ENV"
      - name: Build the zzop + zzop-mcp binaries
        # The binaries report `CARGO_PKG_VERSION` (the workspace version) directly — no tag-stamping env
        # (2026-07-22 version reform). `-p zzop-cli-bin -p zzop-mcp` builds both product bins (`zzop`
        # CLI + `zzop-mcp` server, each its own Cargo package over the shared `zzop-summary` lib) in one
        # invocation.
        shell: bash
        run: cargo build -p zzop-cli-bin -p zzop-mcp --release --target ${{ matrix.target }}
      - name: Collect the zzop + zzop-mcp binaries
        shell: bash
        run: |
          mkdir -p dist-mcp
          case "${{ matrix.target }}" in
            *windows*)
              cp "target/${{ matrix.target }}/release/zzop.exe" "dist-mcp/zzop-cli-${{ matrix.platform }}.exe"
              cp "target/${{ matrix.target }}/release/zzop-mcp.exe" "dist-mcp/zzop-mcp-${{ matrix.platform }}.exe" ;;
            *)
              cp "target/${{ matrix.target }}/release/zzop" "dist-mcp/zzop-cli-${{ matrix.platform }}"
              cp "target/${{ matrix.target }}/release/zzop-mcp" "dist-mcp/zzop-mcp-${{ matrix.platform }}" ;;
          esac
          ls -la dist-mcp
      - name: Smoke-test the collected binaries
        # Native lanes only. `matrix.cross` is unset for win32-x64-msvc / darwin-arm64 / linux-x64-gnu
        # and `"true"` for the two cross lanes (darwin-x64, linux-arm64-gnu), whose binaries cannot
        # execute on the runner that built them — those stay uncovered on purpose, tracked separately.
        #
        # Runs the COLLECTED copies under dist-mcp/, not target/: those are the exact bytes the release
        # asset and the npm platform packages carry, so a bad copy in the step above is caught here too.
        # `version` is the cheapest subcommand that still proves the binary loads and links against the
        # runner's CRT, and it is compared against Cargo.toml's `[workspace.package] version` (which is
        # what `CARGO_PKG_VERSION`, and therefore this output, is built from) — an exit code alone would
        # pass on a binary that printed nothing. Two process spawns; well under a second.
        if: matrix.cross != 'true'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^version = "' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          case "${{ matrix.target }}" in
            *windows*) EXT=".exe" ;;
            *)         EXT="" ;;
          esac
          for bin in zzop-cli zzop-mcp; do
            path="dist-mcp/$bin-${{ matrix.platform }}$EXT"
            # The CLI binary is named `zzop`; only its release-asset filename carries the `-cli` infix.
            if [ "$bin" = "zzop-cli" ]; then expect="zzop $VERSION"; else expect="zzop-mcp $VERSION"; fi
            got=$("./$path" version)
            echo "$path version -> $got"
            if [ "$got" != "$expect" ]; then
              echo "::error::$path printed '$got'; expected '$expect' (Cargo.toml [workspace.package] version is $VERSION)"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: zzop-mcp-${{ matrix.target }}
          path: dist-mcp/*

  # Only runs when `meta` says this run releases. The Claude Code plugin marketplace reads
  # `.claude-plugin/plugin.json`'s "version" straight from the repo at the released commit (no
  # tag-stamping step), so a forgotten bump would silently ship a stale plugin version forever. This
  # job fails the whole run before `release`/`publish` do anything if the committed version and the
  # release version disagree. (On the main-push autotag path, `meta` already checked plugin.json
  # before creating the tag — this is the belt, and it is what catches a manually-pushed tag whose
  # plugin.json was never bumped.) `.claude-plugin/marketplace.json` carries no "version" field today
  # (checked here so this job starts failing loudly the day one is added without being wired in).
  verify-plugin-version:
    needs: meta
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cargo.toml (version SSOT) matches the release version
        # The workspace `[workspace.package] version` is the version SSOT (2026-07-22 reform): the
        # release version, the plugin, and the MCPB manifest all derive from it. This fails the run
        # before `release`/`publish` if a manually-pushed tag disagrees with Cargo.toml.
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          CARGO_VERSION=$(grep -m1 '^version = "' Cargo.toml | sed -E 's/^version = "(.*)"/\1/')
          if [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Cargo.toml [workspace.package] version ($CARGO_VERSION) does not match the release version $VERSION — bump the workspace version in the release commit, or tag the version Cargo.toml already declares."
            exit 1
          fi
          echo "Cargo.toml version ($CARGO_VERSION) matches release version $VERSION."
      - name: Verify .claude-plugin/plugin.json version matches the release version
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          PLUGIN_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          if [ "$PLUGIN_VERSION" != "$VERSION" ]; then
            echo "::error::.claude-plugin/plugin.json version ($PLUGIN_VERSION) does not match the release version $VERSION — bump .claude-plugin/plugin.json's \"version\" in the same commit as the release."
            exit 1
          fi
          echo ".claude-plugin/plugin.json version ($PLUGIN_VERSION) matches release version $VERSION."
          if jq -e 'has("version")' .claude-plugin/marketplace.json >/dev/null; then
            MARKETPLACE_VERSION=$(jq -r '.version' .claude-plugin/marketplace.json)
            if [ "$MARKETPLACE_VERSION" != "$VERSION" ]; then
              echo "::error::.claude-plugin/marketplace.json version ($MARKETPLACE_VERSION) does not match the release version $VERSION."
              exit 1
            fi
            echo ".claude-plugin/marketplace.json version ($MARKETPLACE_VERSION) matches release version $VERSION."
          fi
      - name: Verify server.json's committed versions match the release version
        # Belt for the `meta` autotag gate above (covers the manual-tag path). `publish-mcp-registry`
        # overwrites these before publishing, so this protects READERS of the repo, not the registry
        # payload — see that gate's comment for why a stale placeholder is worth failing a run over.
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          SERVER_VERSIONS=$(jq -r '[.version] + [.packages[].version] | unique | join(",")' server.json)
          if [ "$SERVER_VERSIONS" != "$VERSION" ]; then
            echo "::error::server.json declares version(s) [$SERVER_VERSIONS] but the release version is $VERSION — bump server.json's top-level \"version\" and every packages[].version (and their download URLs) in the release commit."
            exit 1
          fi
          echo "server.json versions ($SERVER_VERSIONS) match release version $VERSION."

  # Only runs when `meta` says this run releases (the build matrix above always runs, including for
  # workflow_dispatch and ordinary main pushes, without releasing). Attaches the 5 bare
  # `zzop-mcp-<platform>[.exe]` binaries (PATH install / Claude Code plugin) AND 5 per-platform
  # `zzop-mcp-<platform>.mcpb` one-click Desktop bundles to the GitHub release. Runs alongside `publish`
  # (npm), not merged into it.
  # THE SHIPPING GATE. Calls `ci.yml` — every mechanical guard, the whole workspace test suite, the
  # cli-shim test and the labeled detection benchmark — on the exact ref being published, and both
  # `release` and `publish` wait on it below.
  #
  # Added 2026-07-28, after an audit walked the trigger graph: `ci.yml` fires on `push: branches:[main]`
  # and `pull_request`, NEITHER of which a tag push matches, while prebuild fires on `tags: [v*]`.
  # Its `build` job is `cargo build` with no test step. So `git push origin v0.25.0` published npm, MCPB
  # and the MCP registry from a ref on which nothing had ever run. Not a hypothetical: it is how every
  # release to date shipped, and it made all 23 guards optional at the only moment they matter.
  #
  # It is a NEEDS edge rather than a copy of the steps — see ci.yml's own `workflow_call` comment.
  gate:
    uses: ./.github/workflows/ci.yml
  release:
    needs: [build, verify-plugin-version, meta, gate]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          TAG="v$VERSION"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --verify-tag --generate-notes
      - name: Download zzop-mcp binaries
        uses: actions/download-artifact@v4
        with:
          pattern: zzop-mcp-*
          path: mcp-artifacts
          merge-multiple: true
      - name: Build per-platform MCPB bundles
        # One `.mcpb` per platform (all on ubuntu, where jq/zip/npx are available — avoids the
        # cross-platform zip problem): stage that platform's binary at bin/zzop-mcp[.exe], stamp the
        # manifest version from meta's release version, validate against the MCPB schema, and zip. See
        # packages/mcpb/README.md.
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version=$v' packages/mcpb/manifest.json > manifest.stamped.json
          npx -y @anthropic-ai/mcpb@latest validate manifest.stamped.json
          for f in mcp-artifacts/zzop-mcp-*; do
            base=$(basename "$f")                       # zzop-mcp-<platform>[.exe]
            plat=${base#zzop-mcp-}; plat=${plat%.exe}   # <platform>
            rm -rf out && mkdir -p out/bin
            case "$base" in
              *.exe) cp "$f" out/bin/zzop-mcp.exe ;;
              *)     cp "$f" out/bin/zzop-mcp && chmod +x out/bin/zzop-mcp ;;
            esac
            cp manifest.stamped.json out/manifest.json
            # A `.mcpb` is installed and then run offline, so the license texts have to travel INSIDE
            # the bundle — a link back to the repo is not a copy of the license, and the third-party
            # notices cover statically-linked crates whose licenses require the notice to accompany
            # the binary. Both are copied per iteration because `rm -rf out` above wipes the staging dir.
            cp LICENSE THIRD-PARTY-NOTICES.md out/
            (cd out && zip -r "../zzop-mcp-$plat.mcpb" manifest.json bin LICENSE THIRD-PARTY-NOTICES.md)
          done
          ls -la ./*.mcpb
      - name: Upload zzop-mcp binaries + MCPB bundles + license texts to the release
        # LICENSE and THIRD-PARTY-NOTICES.md ride along as their own release assets: the bare
        # `zzop`/`zzop-mcp` binaries above are downloaded individually (PATH install, the Claude Code
        # plugin's SessionStart hook), and unlike the `.mcpb` bundles they have nowhere to carry a
        # license text of their own. Anyone who takes a binary off this release page can take the terms
        # it ships under from the same page.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          TAG="v$VERSION"
          gh release upload "$TAG" mcp-artifacts/* ./*.mcpb LICENSE THIRD-PARTY-NOTICES.md --clobber

  # Only runs when `meta` says this run releases. The release version is the single source of truth
  # for the published version: this job overwrites every package.json's committed version with it, so
  # there is no separate "bump packages/cli/package.json before tagging" step to forget.
  #
  # Publishes via npm OIDC "trusted publishing" — no NPM_TOKEN secret. Each of the 6 package names
  # (@zzop/cli + its 5 platform sub-packages) must have a trusted publisher configured on npmjs.com
  # pointing at this repo and this workflow file (packages/cli/README.md "Publishing"). Runs alongside
  # `release` (GitHub release + MCPB), not merged into it.
  publish:
    needs: [build, verify-plugin-version, meta, gate]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Update npm (OIDC trusted publishing needs a recent npm CLI)
        # UNPINNED as of 2026-07-29. The step itself stays: the npm bundled with node 22 is 10.x, which
        # predates OIDC trusted publishing, so a newer npm still has to be installed here.
        #
        # PINNED TO THE MAJOR (`npm@12`), which is a different pin from the `npm@11` that used to be here.
        # The 11.x pin is gone because its stated reason was fixed; the major pin is here because that was
        # never the whole reason. Recorded so nobody re-pins on rumor OR unpins on the same reasoning again:
        # npm@12.0.0 (2026-07-08) was published without a top-level `node_modules/sigstore` in its own
        # tarball, so `npm publish --provenance` died with `Cannot find module 'sigstore'` raised from
        # its bundled `libnpmpublish/lib/provenance.js`. That killed the v0.7.0 publish twice (run
        # 29057344845 and its retry), one day after `@latest` floated onto the new major. npm/cli#9722
        # -> PR #9740 ("correct bundled sigstore from dev dependency conflict") fixed the bundling and
        # shipped in npm@12.0.1 (2026-07-10). Verified by unpacking the published tarballs rather than
        # trusting the changelog: 12.0.0 has only nested copies (under `pacote/` and
        # `workspaces/libnpmpublish/`), while 12.0.1 carries `node_modules/sigstore` at top level again,
        # exactly as 11.18.0 does.
        #
        # WHY THE MAJOR STAYS PINNED even though 12.0.1 is fixed. Re-read the incident: the break arrived
        # ONE DAY AFTER `@latest` floated onto a new major. The thing that hurt was not npm 12 — it was an
        # unreviewed MAJOR arriving between our releases, into a lane that has no rehearsal. `release` and
        # `publish` are SIBLINGS (same `needs:`), so they run in parallel: a broken npm 13 would let the
        # GitHub release and all five .mcpb bundles ship while `npm publish` dies here, leaving a
        # half-shipped release. `npm@12` costs nothing, keeps every 12.x patch and minor, and moves the
        # decision to adopt 13 to a human. Re-evaluate when there is a reason to want 13, not on a date.
        #
        # One coupling this creates: npm 12 requires node `^22.22.2 || ^24.15.0 || >=26.0.0`. The
        # `node-version: 22` above resolves to the newest 22.x (22.23.1 today), which satisfies it —
        # do not lower it to an exact older 22.x without checking npm's `engines` first.
        run: npm install -g npm@12
      - name: Download zzop CLI binaries
        # Over the binary artifacts the `build` job's "Collect the zzop + zzop-mcp binaries" step
        # uploads (`zzop-mcp-<target>`, containing both `zzop-<platform>[.exe]` and
        # `zzop-mcp-<platform>[.exe]`) — `place-artifacts.mjs` below picks out only the
        # `zzop-cli-<platform>[.exe]` binaries it needs.
        uses: actions/download-artifact@v4
        with:
          pattern: zzop-mcp-*
          path: cli-artifacts
          merge-multiple: true
      - name: Set version from meta (overwrites committed version everywhere)
        # CLI package (`@zzop/cli`): bump its own version; its sync script stamps the 5 platform
        # sub-packages' versions and the root package's optionalDependencies pins to match — there is
        # no @zzop/native dependency to pin anymore (the shim spawns the native binary directly).
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: (cd packages/cli && npm version --no-git-tag-version "$VERSION" && node scripts/sync-versions.mjs)
      - name: Place prebuilt binaries into cli platform packages
        run: node packages/cli/scripts/place-artifacts.mjs cli-artifacts
      - name: Publish all 6 packages (resumable)
        # Resumable by design: a version already on the registry is skipped (so "Re-run failed
        # jobs" after a partial publish heals the stragglers instead of dying on the first
        # already-published name), and one name's failure doesn't abort the rest — every package
        # gets its attempt, then the step fails if any attempt failed. First-publish caveat: a
        # brand-new name has no npmjs.com trusted publisher yet, so its OIDC publish fails until
        # the one-time manual claim (packages/cli/README.md "Publishing") — this loop shape means
        # such failures surface per-name instead of masking the healthy ones.
        run: |
          failed=""
          for dir in packages/cli/npm/*/ packages/cli/; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if [ "$(npm view "$name@$version" version 2>/dev/null || true)" = "$version" ]; then
              echo "SKIP $name@$version — already on the registry."
              continue
            fi
            if (cd "$dir" && npm publish --provenance); then
              echo "OK   $name@$version"
            else
              echo "::error::npm publish failed for $name@$version"
              failed="$failed $name"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::publish incomplete — failed:$failed"
            exit 1
          fi

  # Only runs when `meta` says this run releases. Lists zzop-mcp on the OFFICIAL MCP registry
  # (registry.modelcontextprotocol.io) so MCP clients/subregistries can discover it there, alongside
  # the existing GitHub Releases / npm / Claude Code plugin distribution channels — none of which this
  # job touches. `needs: [release, meta]` (not just `meta`): the listing is the 5 per-platform `.mcpb`
  # bundles `release` already built and uploaded, and this job downloads those exact release assets to
  # hash them, so the GitHub release must exist first.
  #
  # Schema reality check (server.schema.json, 2025-12-11): `registryType` is one of
  # npm/pypi/oci/nuget/mcpb only — there is no generic "direct binary download" type. The bare
  # `zzop-mcp-<platform>[.exe]` binaries (PATH install / Claude Code plugin) have no representable
  # package entry under this schema, so `server.json` lists only the 5 `.mcpb` bundles as `mcpb`
  # packages; `repository`/`websiteUrl` in `server.json` remain the discovery pointer for the other
  # install paths. Nothing is fabricated to fill the gap (e.g. no fake npm package for a server that
  # isn't on npm).
  #
  # Auth is GitHub OIDC "trusted publishing" for the `io.github.eezz4` namespace — no stored secret,
  # same shape as npm's OIDC publish in `publish` above. The committed `server.json` is NOT
  # authoritative for a release: this job overwrites every `version`/`identifier`/`fileSha256`
  # from `needs.meta.outputs.version` plus the freshly-hashed release assets before publishing
  # (`fileSha256` is ABSENT from the committed file — no hash of a not-yet-built asset can be
  # committed honestly, and a placeholder would read as an integrity guarantee it is not; the
  # committed version strings are whatever release last touched them and may read stale mid-cycle), so
  # (like `publish`'s "Set version from meta" step) there is no separate "bump server.json before
  # tagging" step to forget. Runs alongside `release`/`publish`, not merged into either — this job
  # failing does not affect them.
  publish-mcp-registry:
    needs: [release, meta]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Download the release's .mcpb bundles (to hash for server.json)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p mcpb-assets
          gh release download "v$VERSION" --pattern '*.mcpb' --dir mcpb-assets
      - name: Stamp version, identifier, and fileSha256 into server.json
        # Rewrites the top-level version and, per platform package entry, the release-tag-specific
        # download URL and that exact asset's SHA-256 — the registry does not itself validate this
        # hash, but MCP clients do before install, so a stale/placeholder hash here would silently
        # fail every client install. `fileSha256` is absent from the committed file; jq's assignment
        # creates the key, so this loop is unchanged by that. The step after this one refuses to
        # publish if it did not.
        #
        # ## The platform list is DERIVED from the `build` matrix (2026-07-29)
        # It used to be a literal `platforms=(...)` array hand-copied from that matrix, and the loop
        # writes `.packages[$i]` BY POSITION. scripts/check-server-json-hashes.sh already guards the
        # array against server.json (packages[] must name the same platforms in the same order) — but
        # both of those lists are downstream of the matrix, and neither of them can see it change.
        #
        # Measured 2026-07-29 on a scratch copy of this file: add a sixth matrix entry
        # (`aarch64-pc-windows-msvc` / `win32-arm64-msvc`), change nothing else, and
        # `check-server-json-hashes.sh` prints "clean (5 packages, ... packages[] matches the stamping
        # loop)" and exits 0. Every equality check passes because they only ever compared the two
        # copies to each other. The release would upload six `.mcpb` bundles and list five, and the
        # missing one is invisible to every check in the chain — the same "a hand list inside the
        # guard's own file cannot see the shipped set grow" defect the guards themselves are made of.
        #
        # So the loop now walks the matrix's own `platform:` values, and `platforms=(...)` survives
        # only as a MIRROR — it is the spelling check-server-json-hashes.sh sed-extracts out of this
        # file, so it has to stay a literal — asserted equal to the matrix before anything is written.
        # That closes the chain end to end: matrix == mirror (here) == packages[] == one hash each
        # (the blocker step below). A sixth platform now fails loudly at exactly the moment it appears.
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json

          # The build matrix's own `platform:` values, in matrix order. A line whose first token is
          # `platform:` occurs ONLY in that matrix — every other mention in this file is a
          # `matrix.platform` expression inside a larger line — so this reads the authority rather
          # than a copy of it. (Deliberately no `$`-brace-brace expression in this comment: the whole
          # `run:` block is one YAML scalar and GitHub substitutes expressions inside it before bash
          # ever sees it, so an example written literally would be evaluated, not quoted.)
          matrix_platforms=()
          matrix_count=0
          while IFS= read -r p; do
            matrix_platforms+=("$p")
            matrix_count=$((matrix_count + 1))
          done < <(sed -n 's/^[[:space:]]*platform:[[:space:]]*\([A-Za-z0-9._-][A-Za-z0-9._-]*\)[[:space:]]*$/\1/p' .github/workflows/prebuild.yml)

          # Empty-enumeration floor, and it is not decorative: with an empty list this loop would stamp
          # NOTHING and `set -euo pipefail` would see a clean run, publishing a server.json whose five
          # entries still carry the committed (absent) hash. The blocker step below would catch that
          # one — but a guard chain whose first link can silently produce nothing is a chain that gets
          # diagnosed from the wrong end. Plain counter, not `${#arr[@]}`, per this repo's convention.
          if [ "$matrix_count" -eq 0 ]; then
            echo "::error::could not read a single 'platform:' value out of the build matrix in .github/workflows/prebuild.yml."
            echo "::error::The matrix was renamed or reshaped, so this step can no longer derive what to stamp. Re-point the extraction; do not hardcode the list back."
            exit 1
          fi

          # The mirror scripts/check-server-json-hashes.sh reads out of this file. NOT the authority —
          # asserted equal to the matrix above, and to server.json's packages[] by that script.
          platforms=(win32-x64-msvc darwin-x64 darwin-arm64 linux-x64-gnu linux-arm64-gnu)
          if [ "${platforms[*]}" != "${matrix_platforms[*]}" ]; then
            echo "::error::the build matrix and the platforms=(...) mirror in this file disagree."
            echo "::error::  build matrix : ${matrix_platforms[*]}"
            echo "::error::  mirror       : ${platforms[*]}"
            echo "::error::This job writes .packages[\$i] BY POSITION, so while these differ a release would list the wrong assets -- or silently omit one that it nonetheless uploaded."
            echo "::error::Fix: update platforms=(...) to match the matrix exactly (same values, same order), and add the matching entry to server.json's packages[]."
            exit 1
          fi

          for i in "${!matrix_platforms[@]}"; do
            plat="${matrix_platforms[$i]}"
            sha=$(sha256sum "mcpb-assets/zzop-mcp-$plat.mcpb" | cut -d' ' -f1)
            url="https://github.com/eezz4/zzop/releases/download/v$VERSION/zzop-mcp-$plat.mcpb"
            jq --argjson i "$i" --arg v "$VERSION" --arg sha "$sha" --arg url "$url" \
              '.packages[$i].version = $v | .packages[$i].fileSha256 = $sha | .packages[$i].identifier = $url' \
              server.json > server.tmp && mv server.tmp server.json
          done
          cat server.json
      - name: Refuse to publish a server.json with a missing or placeholder integrity hash
        # PUBLISH BLOCKER, deliberately between stamping and publishing. The loop above writes
        # `.packages[$i]` by POSITION; jq assigning past the end of an array is not an error, so a
        # sixth package entry or a reordered packages[] would ship unstamped or mis-stamped with
        # `set -euo pipefail` none the wiser. This asserts one well-formed, non-all-zeros fileSha256
        # per package and that packages[] still lines up with `platforms=(...)` — see the script's
        # header for what it does and does not prove. Since 2026-07-29 that array is itself asserted
        # equal to the `build` matrix in the step above, so this link now reaches all the way back to
        # the list of platforms actually built, rather than to a copy of it.
        run: bash scripts/check-server-json-hashes.sh --stamped
      - name: Authenticate to the MCP Registry (GitHub OIDC, io.github.eezz4 namespace)
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json to the MCP Registry
        run: ./mcp-publisher publish
