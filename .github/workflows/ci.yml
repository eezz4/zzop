name: ci

# `workflow_call` exists so the RELEASE lane can require this workflow instead of restating it.
#
# Until 2026-07-28 a `v*` tag push ran `prebuild.yml` alone, and prebuild's `release`/`publish` jobs
# wait only on `[build, verify-plugin-version, meta]` — where `build` is `cargo build` with no test
# step. So the one act that puts bytes in front of users was the one act that ran no test, no guard and
# no detection benchmark on the ref being shipped. Every other lane in this repo is gated; the
# shipping lane was not, and it bypassed all of them at once.
#
# Called rather than copied ON PURPOSE. Restating the guard list inside prebuild would create a second
# enumeration of what "checked" means, and a second enumeration is exactly the defect class this repo
# spent 2026-07-28 removing from sixteen guards — a list nobody remembers to extend stops checking the
# thing it was written for, silently and green.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  # One job runs every mechanical guard as a named step, instead of one fresh ubuntu runner per
  # guard (the old shape spun up ~15 runners, each doing checkout + a single sub-second shell script).
  # The step NAMES preserve per-guard diagnosability — a failing run still points at the exact guard,
  # same as the local pre-commit hook (which is also fail-fast). Wall-clock does not regress: the guard
  # scripts sum to far less than the `test` job's compile, which stays the critical path; we trade
  # unused per-guard parallelism for ~14 fewer runner spin-ups and one checkout instead of fifteen.
  #
  # Step order MIRRORS `.githooks/pre-commit`'s GUARDS array so CI and the local hook agree — the two
  # lists are element-for-element identical, and every guard now asks its question of ONE TREE, so the
  # hook and this job read the same thing as well as run the same list.
  #
  # SHALLOW ON PURPOSE (2026-08-01). This job carried `fetch-depth: 0` — a full-history clone on every
  # run — to serve the one range-shaped guard (`check-parser-fingerprint-bump.sh`, which judged a
  # base..head range). That guard and its `pre-push` hook were deleted on 2026-07-29, when every
  # fingerprint became a hash derived from the source that produces the cached bytes. The full clone
  # outlived its only reader. Measured before removing it: every git call reachable from this job is
  # `ls-files`, `grep`, `hash-object`, `check-ignore`, `config` or `rev-parse` — all of them read the
  # index or the working tree, none reads a commit. No `log`, `describe`, `rev-list`, `merge-base`, or
  # ranged `diff` exists anywhere in `scripts/` or in this file's `run:` blocks. If a guard ever needs a
  # range again, `fetch-depth: 0` must come back WITH THAT GUARD NAMED HERE — an unexplained full clone
  # is how this one survived its own justification.
  #
  # NOTE for maintainers: consolidating renames the required status checks. Any branch-protection rule
  # on `main` listing the old per-guard job names must be updated to `{ guards, test, cli-shim-test }`
  # or the gate silently voids.
  guards:
    runs-on: ubuntu-latest
    # Hang ceiling, not a budget. GitHub's default is 360 minutes, so before 2026-09-06 ANY hang in
    # this workspace burned six runner-hours and reported "cancelled" — which is what a parser that
    # loops instead of panicking would have done (review ledger V27). Measured warm locally: the guard fleet runs in tens of seconds, far inside this ceiling. The FLEET SIZE is deliberately not spelled here -- `ls scripts/check-*.sh | wc -l` answers it, and the number that used to sit in this line said 45 while three files disagreed (review round 18).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: English-only source guard
        run: bash scripts/check-english-source.sh
      - name: max file lines ratchet guard
        run: bash scripts/check-max-file-lines.sh
      - name: swc isolation guard
        run: bash scripts/check-swc-isolation.sh
      - name: ruff isolation guard
        run: bash scripts/check-ruff-isolation.sh
      - name: syn isolation guard
        run: bash scripts/check-syn-isolation.sh
      - name: parser reachability census (transitive; the four text guards above see direct edges only)
        run: bash scripts/check-dep-closure.sh
      - name: tree-sitter isolation guard
        run: bash scripts/check-tree-sitter-isolation.sh
      - name: rule extension closure (a rule that reads .js must read .jsx/.mjs/.cjs)
        run: bash scripts/check-rule-extension-closure.sh
      - name: git spawn isolation guard
        run: bash scripts/check-git-spawn-isolation.sh
      - name: guards-wired meta-guard
        run: bash scripts/check-guards-wired.sh
      - name: pack message ↔ pre-migration fixture pairing guard
        # Those fixtures are byte-identity snapshots and are therefore a SECOND copy of every rule
        # message. The convention that they must be updated together lived only in a comment and was
        # violated three times, the last of which left HEAD red for two days and kept a deleted
        # dangerous prescription alive in the fixture. Pure text comparison, no build.
        run: bash scripts/check-fragment-fixture-pairing.sh
      - name: MCP tool roster -> README guard
        # README is the install page an operator reads to decide what zzop can answer, and its tool
        # roster had been one short (check_coverage) for as long as anyone measured -- a shipped
        # capability nobody would ask for. Text comparison against definitions.rs, no build.
        run: bash scripts/check-mcp-tools-listed.sh
      - name: CLI flag surface -> docs floor guard
        # A flag no page names is one no user can find, and it comes back as a bug report saying the
        # capability is missing. This is a FLOOR (zero undocumented), not a completeness rule: README
        # is an install page, not a manual. Text comparison, no build.
        run: bash scripts/check-cli-flags-documented.sh
      - name: Rule-id rename record guard
        # `VERSIONING.md` promises rule ids are a frozen surface and that every rename reaching a
        # release lands as a row. Every other half of that promise was machine-held; this half was not,
        # so a rename that edited the catalog and the labelled corpus together passed the whole fleet
        # green with no CHANGELOG row (review ledger V86). Diffs the catalog id set against the release
        # tag read from `git ls-remote` -- a local `git tag` answers when this clone last fetched.
        run: bash scripts/check-rule-id-renames-recorded.sh
      - name: CI job hang-ceiling guard
        # Every job in this file must declare timeout-minutes. Without one it inherits GitHub's
        # 360-minute default, so a hang -- the failure shape the parser property tests structurally
        # cannot see, since they assert "does not panic" -- burns six runner-hours and then reports
        # "cancelled", which reads as infrastructure flaking rather than a defect here. Text scan of
        # this same file, no build. It guards itself.
        run: bash scripts/check-ci-job-timeouts.sh
      - name: cached per-file finding producers guard
        # cache::cache_relevant_disabled_rules narrows the per-file cache key to the disabled ids that
        # can actually reach a cached entry -- so a whole-graph toggle stops costing a cold run (2,298
        # hits -> 2,298 misses, measured). That narrowing rests on there being exactly TWO producers of
        # cached findings; this fails the moment a third appears. Text scan, no build.
        run: bash scripts/check-cached-finding-producers.sh
      - name: rule message -> shipped band guard
        # The sibling of the step below, one layer along: that one ties the PUBLISHED severity to the
        # shipped one, this one ties the severity a message SPEAKS to it. Nine messages explained why
        # they were `warning` while shipping `info`, and two pointed at a sibling band a different
        # batch had already moved. Text comparison, no build.
        run: bash scripts/check-message-band-claims.sh
      - name: catalog severity -> shipped pack severity guard
        # A severity is the one cell in that table a user ACTS on: it decides whether --fail-on
        # warning breaks their build. It was also the one column nothing tied back to the packs --
        # 27 rules moved warning -> info and the catalog (and the site it feeds) kept the old value
        # with all 40 guards and the whole test suite green. Text comparison, no build.
        run: bash scripts/check-catalog-severity-sync.sh
      - name: shipped-off set -> the six documents that enumerate it
        # Which analyses do NOT run by default is invisible in a reply's findings -- a shipped-off
        # analysis produces no key, exactly like one that ran clean -- so prose is the only channel that
        # says so, and six files spell the same three ids out. A stale copy does not read as stale: it
        # reads as "this id runs by default" and sends a user to debug a rule that never ran. Total
        # accounting both ways, so a REMOVAL from the set fails too. Text comparison, no build.
        run: bash scripts/check-shipped-off-sync.sh
      - name: rules catalog ↔ site sync guard
        run: bash scripts/check-rules-catalog-sync.sh
      - name: generated site pages ↔ site-src freshness guard
        # site/index.html and site/ko/index.html are written by scripts/gen-site.mjs and COMMITTED,
        # because Pages serves site/ as files. A site-src/ edit without a regeneration leaves the repo
        # carrying a page that will never be deployed, and nothing else notices: the stale page is still
        # valid HTML, still links correctly, still passes every prose guard. Same defect the site-graph
        # step in `cli-shim-test` closed for the dep-graph data; this one needs no Rust build, so it runs
        # here — and in pre-commit — instead of one push later.
        run: bash scripts/check-site-generated.sh
      - name: rule description ↔ matcher token guard
        run: bash scripts/check-rule-desc-tokens.sh
      - name: pack message ↔ engine-appended suppress sentence guard
        run: bash scripts/check-pack-suppress-sentence.sh
      - name: matcher glossary ↔ Matcher enum guard
        run: bash scripts/check-matcher-glossary-sync.sh
      - name: docs rule-id ↔ catalog sync guard
        run: bash scripts/check-docs-rule-ids.sh
      - name: doc config-snippet key ↔ config-surface guard
        run: bash scripts/check-doc-config-keys.sh
      - name: prose rule-id ↔ shipped rule guard
        run: bash scripts/check-prose-rule-ids.sh
      - name: runtime-text rule-id guard (finding messages, native + packs)
        run: bash scripts/check-runtime-text-rule-ids.sh
      - name: marker-claim ↔ engine leader-table guard
        run: bash scripts/check-marker-claims.sh
      - name: packs.disabled/only pack-id guard
        run: bash scripts/check-pack-id-values.sh
      - name: docs link-graph guard
        run: bash scripts/check-docs-link-graph.sh
      - name: io-key kind-vocabulary sync guard
        run: bash scripts/check-io-key-vocab.sh
      - name: policy-value census guard
        run: bash scripts/check-policy-census.sh
      - name: ci-local mirror guard
        # `scripts/ci-local.sh` answers "will this break CI?" in one command. A mirror that silently
        # stops mirroring is worse than none — it reports green while omitting the failing step.
        run: bash scripts/check-ci-local-mirrors-ci.sh
      - name: retired config-vocabulary guard
        # A config file has been mandatory since 2026-07-27; the sentences saying otherwise outlived the
        # behaviour by four months and one of them shipped the exact inverse on the MCP wire.
        run: bash scripts/check-retired-config-vocabulary.sh
      - name: convention-vocabulary declarability ratchet
        # Reads the census's `convention` axis: a name the PROJECT picks must be declarable in config,
        # not held as a built-in guess. scripts/convention-vocab-baseline.txt freezes pre-existing debt
        # and only shrinks — it is not an exemption list.
        run: bash scripts/check-convention-vocab-declarable.sh
      - name: committed-config convention-vocabulary sync
        # EVERY committed zzop.config.jsonc — subject derived from `git ls-files`, not a directory
        # pathspec — must declare the SAME vocabulary block the starter template does. Since an
        # undeclared key is a judgment not made, a fixture that omits it would have the detection
        # benchmark score a deliberately blinded engine. Renamed from `example-config` on 2026-08-01:
        # the old name said `examples/` while the pathspec read `cases/` only, so the two configs
        # outside `cases/` had never been read (25 committed, 23 checked).
        run: bash scripts/check-committed-config-vocabulary.sh
      - name: config-surface readBy column is derived, not hand-edited
        run: bash scripts/check-config-surface-read-by.sh
      - name: shell pipe-to-grep-q SIGPIPE seal
        run: bash scripts/check-shell-pipe-sigpipe.sh
        # A different needle from the seal above, on the same hazard family: that one bans `| grep -q`,
        # this one bans an empty-set floor its own assignment can never reach. Neither says anything
        # about the other's shape.
      - name: unreachable empty-set floor seal
        run: bash scripts/check-shell-mute-floor.sh
        # Third needle on the same family, and the only one whose subject is SIZE: a here-string over
        # 64 KiB deadlocks the script silently, and the strings that grow to 64 KiB are the ones this
        # fleet builds out of `git ls-files`. Neither of the two above says anything about length.
      - name: here-string 64 KiB deadlock seal
        run: bash scripts/check-shell-herestring-scale.sh
      - name: version-string parser-completeness guard
        run: bash scripts/check-version-lists-parsers.sh
      - name: framework recognizer ↔ parser prose guard
        run: bash scripts/check-framework-prose-enumeration.sh
      - name: release-asset name prose drift guard
        run: bash scripts/check-asset-name-prose.sh
      - name: deployment/inventory count prose drift guard
        run: bash scripts/check-deploy-facts-prose.sh
      - name: overclaim prose guard
        run: bash scripts/check-overclaim-prose.sh
      - name: version-relative prose guard
        # Three published sentences were false one release after v0.30.0 shipped with the whole fleet
        # green; markdown was outside check-release-version-propagation.sh reach. See the script header.
        run: bash scripts/check-version-relative-prose.sh
      - name: vendor-token literal guard
        # Scans the INDEX as well as the working tree (see its header): on a fresh checkout the two are
        # identical, so here it is reading exactly the blobs this ref would push — which is the surface
        # GitHub push protection reads and the reason this guard exists.
        run: bash scripts/check-vendor-token-literals.sh
      - name: server.json integrity-hash guard
        # Committed-file mode: server.json must claim NO fileSha256 (the assets it names do not exist
        # until the release builds them), and its packages[] must still line up with the positional
        # stamping loop in prebuild.yml. That job runs the same script's --stamped mode as a publish
        # blocker after stamping.
        run: bash scripts/check-server-json-hashes.sh
      - name: release-version propagation guard
        # Every committed version on the release surface (plugin.json, server.json's version fields and
        # its packages[] download URLs) must equal Cargo.toml's [workspace.package] version. prebuild's
        # `meta` and `verify-plugin-version` jobs ask the same question, but both run AFTER the push that
        # creates the tag — v0.26.0 shipped with server.json at 0.25.0 for exactly that reason. This one
        # runs on every commit, in pre-commit as well, so the bump and its propagation cannot separate.
        run: bash scripts/check-release-version-propagation.sh
      - name: embedded contract docs guard
        # The docs `crates/summary/src/contracts.rs` bakes with include_str! reach a reader only through
        # a RELEASE — a prebuilt binary serves the bytes of the release it was built from. So "docs-only
        # change, no release needed" is false for exactly that set, and VERSIONING.md must list exactly
        # it. Both directions: an unlisted baked doc hides a release requirement, a listed unbaked one
        # invents one.
        run: bash scripts/check-embedded-contract-docs.sh
      - name: license shipping guard
        # Every distribution root must carry the root LICENSE, every workspace Cargo.toml must declare a
        # license, and THIRD-PARTY-NOTICES.md must still be the file its generator would produce. MIT
        # requires the notice to travel with the copies; the statically linked Apache-2.0 crates require a
        # license copy under their own section 4(a). Shipping without them is not a bug report, it is a
        # legal review reject.
        #
        # This step needs only git and node. Verification is OFFLINE by construction: the notices file
        # carries two digests (one over the tracked Cargo.lock/Cargo.toml set, one over its own generated
        # body), so `--check` never invokes cargo and never touches the network. That matters here
        # specifically — this job is checkout-and-nothing-else, with no Rust toolchain and no rust-cache,
        # and a guard that needed a registry fetch would have turned a fast, network-free job into a slow
        # one with a new way to go red for reasons that have nothing to do with licensing. GENERATING the
        # file still needs a cargo toolchain; only verifying it does not.
        run: bash scripts/check-license-shipping.sh
      - name: adapter example tests
        # `examples/adapters/adapter-kit` re-implements `zzop_core::io::key`'s normalization in JS, and
        # that module's header requires the two to stay byte-identical ("their logic must not change here
        # without changing every mirror"). Until 2026-07-28 nothing ran these — a Rust-side change could
        # make every copied adapter emit mis-keyed envelopes, which join wrongly and silently.
        #
        # Wiring them found the mirror intact and the TEST broken: keys.test.js resolved the shared
        # fixture one directory short of the repo root, so the whole file aborted on ENOENT and 40 of its
        # assertions had never executed. A parity suite nobody runs does not decay loudly.
        #
        # The subject set is DERIVED, not hand-typed. This step's first spelling was
        # `node --test examples/adapters/adapter-kit/test/*.test.js` — ONE directory, ONE extension — and
        # it ran zero of the two sibling adapters' suites, which are `.mjs` and live under
        # `auth-overlay-adapter/` and `java-imports-adapter/`. Measured 2026-07-28 by expanding that glob
        # in a shell: 3 files, neither sibling among them, while both suites existed and passed. One of
        # them is the ONLY test pinning the adapter envelope snapshot contract. A hand-typed glob cannot
        # see a suite nobody remembered to add to it — the same defect class this repo spent 2026-07-28
        # removing from sixteen guards, re-committed here in the same week.
        #
        # The zero-file abort is the sibling half: a pathspec that stops matching would otherwise make
        # this step pass by running nothing, which is what the enumeration exists to prevent.
        #
        # `git ls-files` + shell word splitting, not `node --test <dir>` — the bare-directory form throws
        # MODULE_NOT_FOUND on this runner's Node (see cli-shim-test below), and letting git expand the
        # pathspec keeps a no-match case detectable instead of passing a literal pattern to node.
        #
        # No Rust build needed, so it rides the guards job rather than paying for a toolchain.
        run: |
          set -euo pipefail
          files="$(git ls-files -- 'examples/adapters/*/test/*.test.js' 'examples/adapters/*/test/*.test.mjs')"
          if [ -z "$files" ]; then
            echo "adapter example tests: FAILED -- enumerated ZERO test files. The pathspec stopped" >&2
            echo "matching, so this step proved nothing. An empty subject set is a broken runner," >&2
            echo "never a clean tree." >&2
            exit 1
          fi
          echo "$files"
          node --test $files

  test:
    # Linux only, and that is a recorded choice rather than an oversight (2026-09-07, review ledger
    # V72). `prebuild.yml` builds five targets and smoke-tests three of them by running `version`;
    # nothing but this job ever runs the suite, so macOS and Windows are proven to LOAD and not to
    # ANALYZE. The engine carries no platform-specific code path -- the split that would justify a
    # matrix here -- and macOS runner minutes bill at ten times Linux, so the trade is stated in
    # README's download section for the reader who has to weigh it, instead of being paid blindly.
    # If a platform-conditional path ever lands in the engine, this comment is the thing that is now
    # wrong: add the matrix in the same change.
    runs-on: ubuntu-latest
    # Hang ceiling, not a budget. GitHub's default is 360 minutes, so before 2026-09-06 ANY hang in
    # this workspace burned six runner-hours and reported "cancelled" — which is what a parser that
    # loops instead of panicking would have done (review ledger V27). Measured warm locally: `cargo test --workspace` is 304s, before fmt/clippy and a cold build.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  cli-shim-test:
    # Proves the @zzop/cli npm shim actually works against a real native `zzop` binary. Mirrors
    # prebuild.yml's non-cross x86_64-unknown-linux-gnu matrix entry: ubuntu-latest's host target
    # already *is* x86_64-unknown-linux-gnu, so no --target/cross-linker setup is needed, and Node is
    # preinstalled on the runner image.
    runs-on: ubuntu-latest
    # Hang ceiling, not a budget. GitHub's default is 360 minutes, so before 2026-09-06 ANY hang in
    # this workspace burned six runner-hours and reported "cancelled" — which is what a parser that
    # loops instead of panicking would have done (review ledger V27). Dominated by one release build of the CLI binary.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build native zzop CLI binary
        # @zzop/cli is a zero-logic shim that spawns the native `zzop` binary — its own dev-fallback
        # path resolution only checks a release build (../../target/release/zzop[.exe] relative to
        # packages/cli, no debug fallback), so this needs --release, not a debug build.
        run: cargo build -p zzop-cli-bin --release
      - name: the break-a-route demo still demonstrates what it says
        # The headline capability had no runnable public demonstration for ~34 releases: the older
        # demo needs corpus/oss/, which is gitignored and which nothing fetches. This one runs on a
        # committed pair and ASSERTS the join state at each step, so it fails instead of narrating a
        # state it is not in -- the failure mode a README block here already reached four times.
        # It rides this job for the same reason the step below does: the release binary is built above.
        run: bash docs/demo/break-a-route-shipped.sh
      - name: site graph is regenerated from the tree it claims to draw
        # `site/graph.html` carries a COMMITTED data block — every node of this repo — plus three prose
        # totals that describe it. All four are written by scripts/site-graph-data.mjs. (A fourth prose
        # copy sat in `site/architecture.html` until 2026-08-14, when that page became a redirect stub;
        # the anchor was dropped rather than re-pointed, and that script's header says why.) Until
        # 2026-07-29 NOTHING ran the generator: measured,
        # it had zero callers anywhere in the tree outside itself. A generator nobody runs and an output
        # everybody commits drift by default, and the drift is invisible — the page keeps rendering, just
        # of a tree that no longer exists. That is the exact defect the generator was written to close
        # (hand-typed prose counts), reappearing one level up as the generator itself being unwired.
        #
        # This rides `cli-shim-test` because that job ALREADY builds `zzop` in release for its own reason.
        # A dedicated job would pay a second release build for one diff; a scripts/check-*.sh would pay it
        # on every commit, which no local hook budget survives.
        run: |
          set -euo pipefail
          ./target/release/zzop graph --domain dep --format cosmograph-nodes --config zzop.config.jsonc > /tmp/n.ndjson
          ./target/release/zzop graph --domain dep --format cosmograph-links --config zzop.config.jsonc > /tmp/l.ndjson
          node scripts/site-graph-data.mjs /tmp/n.ndjson /tmp/l.ndjson
          # `site-src/graph/page.html` is the file the generator WRITES; `site/` is what
          # `gen-site.mjs` later builds from it. Diffing only `site/` made this step unable to fail
          # from 2026-08-18 (when the shipped page moved to `gen-site.mjs`) until 2026-09-08:
          # `zzop graph` reported 1,683 nodes while both committed pages said 1,677, and every
          # guard was green. Both paths, so the chain closes — this step proves the SOURCE is fresh
          # and `check-site-generated.sh` proves `site/` is that source rendered.
          if ! git diff --quiet -- site/ site-src/graph/page.html; then
            echo "::error::the site graph is stale — regenerating it changed these files:" >&2
            git --no-pager diff --stat -- site/ site-src/graph/page.html >&2
            echo "Run: zzop graph --domain dep --format cosmograph-nodes/links > … then node scripts/site-graph-data.mjs <nodes> <links>" >&2
            exit 1
          fi
          echo "site graph matches the tree."
      - name: zzop analyzes zzop — findings pinned at zero, with a canary
        # The FINDINGS half of the dogfood claim. The dep-graph half is the step directly above; until
        # now nothing ran `zzop analyze` on this repo at all, so the committed `zzop.config.jsonc` was
        # answering its one question ("is our own cache lane closed?") only when a human asked by hand.
        #
        # Rides this job for the same reason the site step above does: it ALREADY builds `zzop` in
        # release, so the binary is free here. A sixth job would pay a second release build (minutes) to
        # answer a question that costs seconds once the binary exists, and would split one dogfood run
        # across two jobs. A scripts/check-*.sh is not an option either — check-guards-wired.sh would
        # then require it in .githooks/pre-commit, and a release build is not a per-commit hook's budget.
        #
        # The gate pins zero with NO baseline file on purpose, and it plants a real violation and
        # requires it to be found before it will trust that zero — see the script's header for why the
        # canary is the larger half of it.
        run: bash scripts/measure/self-analysis-gate.sh
      - name: CLI shim tests
        # Individual FILE paths, never a bare directory — `node --test test/` fails on Node v22+
        # (verified: the bare-directory form throws MODULE_NOT_FOUND on this runner's Node version).
        #
        # Zero-file abort, same shape as the `adapter example tests` step above. This step used to be a
        # bare `node --test packages/cli/test/*.test.js`, and the failure mode is not the one a reader
        # assumes: an unmatched SHELL glob is passed through literally, and `node --test` on a path that
        # matches nothing does NOT error — measured 2026-07-29, it printed `1..0 / # tests 0 / # pass 0`
        # and exited 0. So renaming the directory, or renaming the one suite in it to `.mjs`, would turn
        # this job green while running zero assertions against the shim, which is the ONLY thing proving
        # the npm shim can spawn the native binary at all.
        #
        # `git ls-files` + shell word splitting rather than the shell glob, for the same reason the
        # adapter step uses it: a git pathspec that matches nothing yields an EMPTY string, which is
        # detectable, where an unmatched shell glob yields a literal pattern that node quietly accepts.
        # Both `.js` and `.mjs` are enumerated so a suite added in either extension is covered from the
        # moment it exists, rather than waiting for someone to remember this line.
        run: |
          set -euo pipefail
          files="$(git ls-files -- 'packages/cli/test/*.test.js' 'packages/cli/test/*.test.mjs')"
          if [ -z "$files" ]; then
            echo "CLI shim tests: FAILED -- enumerated ZERO test files. The pathspec stopped matching," >&2
            echo "so this step proved nothing about the @zzop/cli shim. An empty subject set is a broken" >&2
            echo "runner, never a clean tree." >&2
            exit 1
          fi
          echo "$files"
          node --test $files

  detection-benchmark:
    # Scores the labeled detection benchmark (cases + its adjudicated EXPECTED.jsonc) and fails
    # on any FN or FP. Committed 2026-07-26 so CI *could* see these cases; nothing scored them until
    # 2026-07-28, which meant a 298-line ground truth was documentation rather than a gate.
    #
    # Its own job rather than a step in `test`: it needs a --release build (a debug binary makes the
    # two-axis run over 15 trees several times slower for no extra signal) and Node, and keeping it
    # separate means a red score reads as "detection regressed", not as "the test job failed".
    #
    # Deliberately NOT a scripts/check-*.sh — check-guards-wired.sh would then require it in
    # .githooks/pre-commit too, and a release build per commit is not a hook's budget.
    #
    # ONE STEP, NO BINARY PATH (2026-07-29). This job used to build the binary itself and hand
    # `target/release/zzop-mcp` to the gate, which asserted only that the path was executable. That
    # made the path a parameter, and a parameter is something that can be stale: measured locally, a
    # 0.24.0 binary scored the 0.25.0 tree as TP 143 / FN 0 / FP 0 with exit 0. CI happened to be safe
    # because its build step sat immediately above — but the LOCAL run is the only place a developer
    # can see a detection regression before pushing, and there nothing guaranteed the two matched.
    # The gate builds its own binary now, so this job stops restating a build the script performs and
    # stops naming an artifact path it has no business knowing (that path is also wrong under
    # $CARGO_TARGET_DIR, and CI and local now agree instead of each having their own spelling).
    runs-on: ubuntu-latest
    # Hang ceiling, not a budget. GitHub's default is 360 minutes, so before 2026-09-06 ANY hang in
    # this workspace burned six runner-hours and reported "cancelled" — which is what a parser that
    # loops instead of panicking would have done (review ledger V27). Measured locally: 69-98s to score 25 trees once the release binary exists.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Detection benchmark
        run: bash scripts/measure/detection-gate.sh
      - name: README reproduction block vs the real run
        # The README block is a COPY of numbers only a run knows. It went stale four times before
        # anything checked it, and the fourth shipped in v0.34.0 with every guard green. It rides in
        # THIS job because it needs a --release build -- which is exactly why it is not a check-*.sh
        # (this job states that argument above). With no index staged it runs unconditionally.
        run: bash scripts/measure/readme-result-block.sh

  site-render-check:
    # The one lane that looks at the PICTURE. Every other site lane checks data — staleness (the
    # cli-shim-test step above proves site/ regenerates from the tree it claims to draw), links,
    # prose guards — and all of them were green while a release shipped graph.html with the whole
    # 1,137-node graph rendered into a 300x150 corner of a 1272x720 stage (a <canvas> is a replaced
    # element: absolutely positioned with `inset: 0` but no width/height, it keeps its intrinsic
    # size). The finder was the user. Two checks, targeting exactly that accident class (2026-07-30
    # user ruling; pixel-ratio and golden-image lanes considered and not built — a threshold becomes
    # a policy value, a golden image breaks on font rendering): zero console/page errors on every
    # page, and #depgraph's bounding rect must fill .graph-stage. Both axes red-verified against
    # planted violations before this job existed.
    #
    # Its own job, not a scripts/check-*.sh: the browser download is not a pre-commit hook's budget
    # (check-guards-wired.sh would force it into .githooks/pre-commit).
    runs-on: ubuntu-latest
    # Hang ceiling, not a budget. GitHub's default is 360 minutes, so before 2026-09-06 ANY hang in
    # this workspace burned six runner-hours and reported "cancelled" — which is what a parser that
    # loops instead of panicking would have done (review ledger V27). A browser download plus two page checks; no cargo build.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install playwright (pinned) + chromium
        run: |
          set -euo pipefail
          npm ci --prefix scripts/site-render-check
          npx --prefix scripts/site-render-check playwright install --with-deps chromium
      - name: Pages render clean and the graph canvas fills its stage
        run: node scripts/site-render-check/check.mjs site
