[package]
name = "zzop-git"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
zzop-core = { path = "../core" }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
# `skip_notice!` — the one stderr writer `src/tests.rs` is allowed. That module is a `#[cfg(test)]
# mod` inside this LIBRARY, so covering it with a crate-level `#![allow]` would open the hole in the
# very lib the lint policy protects; a dev-dependency keeps it out of the build.
zzop-test-support = { path = "../test-support" }

# Inherit the workspace lint policy (root Cargo.toml [workspace.lints.clippy]) — every member does,
# with no exceptions. Where a single target legitimately violates one, the exemption is a crate-level
# #![allow] at that target's entry point, never a hole in this table.
[lints]
workspace = true
