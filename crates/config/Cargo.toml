# The config front-end shared by both native host products: zzop.config.jsonc discovery -> JSONC
# stripping -> the config->facade-request mapper -> `trees: "auto"` workspace expansion, plus REQUEST
# ASSEMBLY (`src/trees.rs`, `src/paths.rs`) — which trees a call is about and the host-boundary path
# absolutization every tree root crosses. A shared rlib so both hosts map configs identically: the
# `zzop` CLI (`packages/cli-bin`, whose multi-tree subcommands take `--config` — its main.rs argv
# dispatch is the canonical list; the fixed-arity `analyze` is not one of them) and the `zzop-mcp`
# server (`packages/mcp`, whose tools take `configPath`). Originally
# ported from the removed JS front-end; the emitted request JSON is pinned against the committed
# docs/contracts/config-parity.fixture.json golden by tests/config_parity.rs.
[package]
name = "zzop-config"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
serde_json = { workspace = true }
# For `zzop_cache::DEFAULT_CACHE_DIR` only — the mapper's `cacheDir` default. A path this front-end
# emits and the cache store writes to is ONE policy value, so it gets ONE definition, in the crate that
# owns the store, rather than a matching literal in each. No cache code runs here; this front-end still
# only ever produces request JSON.
zzop-cache = { path = "../cache" }
# The convention-vocabulary NORMALIZATION table this front end warns against lives in the kernel
# (`zzop_core::vocab_norm`), beside the transforms the consuming rules call — so the warning and the
# comparison cannot drift apart. That is the whole shipped need, and it is one function.
zzop-core = { path = "../core" }

[dev-dependencies]
# TESTS ONLY, and that is the point of this section existing (2026-09-08, review ledger V122). This
# front end used to depend on the whole engine because ONE shipped line read a table that lived there;
# the table moved to the kernel and the shipped edge went with it. What is left is test-only: the
# template tests build `VocabularyConfig::built_in()` and read `rule_sightlines()`, and one test runs a
# real `analyze_trees` end to end. A dev-dependency does not enter this crate's shipped closure, so
# `zzop-config` no longer drags swc and eight parser crates behind it while its own manifest says it
# never analyzes anything.
zzop-engine = { path = "../engine" }

# Inherit the workspace lint policy (root Cargo.toml [workspace.lints.clippy]) — every member does,
# with no exceptions. Where a single target legitimately violates one, the exemption is a crate-level
# #![allow] at that target's entry point, never a hole in this table.
[lints]
workspace = true
