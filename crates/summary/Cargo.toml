[package]
name = "zzop-summary"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The host-shared answer layer both zzop products call: shaping/caps/filters/warning-merge, the
# facts/graph/manifest projections, and the embedded authoring-contract table. Nothing below
# `zzop-facade`/`zzop-config` is a shipped dependency — a host needs only this crate (the facade entry
# points a product still uses verbatim are re-exported from `src/lib.rs`, never wrapped).
[dependencies]
zzop-facade = { path = "../facade" }
zzop-config = { path = "../config" }
serde_json = { workspace = true }

[dev-dependencies]
# Test-only, for ONE derivation: `contracts.rs`'s pin that the `rule-catalog` resource description spells
# the real suppress-marker form derives it from `zzop_core::RuleDef::suppress_marker_for_id` rather than
# from a literal, so a future marker change cannot leave the shipped description behind. No shipped code
# in this crate reaches below `zzop-facade`/`zzop-config`.
zzop-core = { path = "../core" }
# Same shape, same reason (T2 — the layering above forbids a SHIPPED dependency, so the relation is
# sealed by a test instead): `graph/posture.rs` must draw exactly the verbs `mutating-route-no-auth`
# gates on, and its local list is pinned equal to the rule's own `WRITE_HTTP_METHODS`. Added 2026-07-28
# after a release audit measured the drift live — widening the rule's set left every test in the
# workspace green while this diagram silently kept covering the old four.
zzop-rules-http = { path = "../../rules/native/rules-http" }
# Test-only again, same T2 shape: `graph/cosmograph.rs`'s emitted column schema is published as prose in
# `docs/contracts/surface-parity.json` and `site/usage.html`, and neither can reference a Rust value, so
# the relation is sealed by a test that reads both documents. Matching a column LIST (delimited names
# joined by slashes) rather than a bare name mention is the whole point — see that test's own doc for
# the drift a looser matcher let through — and that needs a real regex, not `str::contains`.
regex = { workspace = true }
