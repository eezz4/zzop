[package]
name = "zzop-facade"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
zzop-core = { path = "../core" }
zzop-metrics = { path = "../metrics" }
zzop-engine = { path = "../engine" }
# Data dependency only: `zzop-config` owns the ONE compile-time embed of the bundled rule packs
# (`BUNDLED_PACK_SOURCES`, build.rs) — both `analyze_envelope_json`'s bundled-pack default and
# `explain`'s rule lookup read it instead of embedding the same JSON a second time ("one embed, one
# truth"). No config-front-end logic (discovery/JSONC/mapping/request assembly) is called from this
# crate; the dependency edge stays acyclic (`zzop-config` depends only on `serde_json` + `zzop-cache`
# and must never depend on this crate's request types — see `src/lib.rs`'s corollary).
zzop-config = { path = "../config" }
# No parser path deps: `version_string()`'s diagnostic form reads the derived fingerprints through
# `zzop_engine::parser_fingerprints()` (id + source hash in one value, same owner as the cache key)
# instead of each parser's `PARSER_FINGERPRINT` constant — the eight direct parser deps this crate
# carried for that one function were retired with the 2026-08-03 derived-stamp reform.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# `skip_notice!` — the one stderr writer `src/analyze_tests.rs` is allowed. That module is a
# `#[cfg(test)] mod` inside this LIBRARY, so covering it with a crate-level `#![allow]` would open
# the hole in the very lib the lint policy protects; a dev-dependency keeps it out of the build.
zzop-test-support = { path = "../test-support" }

# Inherit the workspace lint policy (root Cargo.toml [workspace.lints.clippy]) — every member does,
# with no exceptions. Where a single target legitimately violates one, the exemption is a crate-level
# #![allow] at that target's entry point, never a hole in this table.
[lints]
workspace = true
