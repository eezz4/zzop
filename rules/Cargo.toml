[package]
name = "zzop-rule-packs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# This crate has no library code of its own (see src/lib.rs) — it exists to give each DSL rule pack's
# co-located `dsl/<pack>/<pack>.rs` a `[[test]]` target, so `cargo test --workspace` exercises every pack
# end-to-end from right next to the pack's own JSON. One `[[test]]` entry per pack folder that ships rules
# (a pack with 0 rules would have no <pack>.rs and no entry here; none exist today).
#
# The `rule_contracts` meta-test (crates/engine/tests/rule_contracts/) machine-checks that this list stays in
# sync with rules/dsl/*/<pack>.rs on disk — a pack that ships rules but has no [[test]] entry here (or vice
# versa) fails that contract test.

[dependencies]

[dev-dependencies]
zzop-core = { path = "../crates/core" }
zzop-engine = { path = "../crates/engine" }
serde_json = { workspace = true }

[[test]]
name = "pack_db"
path = "dsl/db/db.rs"

[[test]]
name = "pack_reliability"
path = "dsl/reliability/reliability.rs"

[[test]]
name = "pack_security"
path = "dsl/security/security.rs"

[[test]]
name = "pack_browser"
path = "dsl/browser/browser.rs"

[[test]]
name = "pack_egress"
path = "dsl/egress/egress.rs"

[[test]]
name = "pack_go"
path = "dsl/go/go.rs"

[[test]]
name = "pack_http"
path = "dsl/http/http.rs"

[[test]]
name = "pack_perf"
path = "dsl/perf/perf.rs"

[[test]]
name = "pack_react"
path = "dsl/react/react.rs"

[[test]]
name = "pack_redis"
path = "dsl/redis/redis.rs"

[[test]]
name = "pack_sql"
path = "dsl/sql/sql.rs"

# Inherit the workspace lint policy (root Cargo.toml [workspace.lints.clippy]) — every member does,
# with no exceptions. Where a single target legitimately violates one, the exemption is a crate-level
# #![allow] at that target's entry point, never a hole in this table.
[lints]
workspace = true

# EXPORTED packs (examples/packs/) keep their tests too — see examples/packs/tests/orm_eager.rs for why
# that is not the default, and what the `typescript` export cost by not doing it.
[[test]]
name = "pack_orm_eager"
path = "../examples/packs/tests/orm_eager.rs"

[[test]]
name = "pack_sql_preferences"
path = "../examples/packs/tests/sql_preferences.rs"

[[test]]
name = "pack_code_hygiene"
path = "../examples/packs/tests/code_hygiene.rs"
