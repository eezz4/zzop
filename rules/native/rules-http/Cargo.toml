[package]
name = "zzop-rules-http"
version.workspace = true
edition = "2021"
license.workspace = true
publish = false

[dependencies]
zzop-core = { path = "../../../crates/core" }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Test-only: builds `write_sites` on hand-built fixtures via the same detection function production
# code uses (`zzop_parser_typescript::write_sites_for_symbol`), so http_scan's unit tests exercise the
# real parser-computed fact rather than a re-implemented test double. Production code in this crate
# still depends on `zzop-core` only (see `lib.rs`'s module doc).
zzop-parser-typescript = { path = "../../../parser/parser-typescript" }

# Inherit the workspace lint policy (root Cargo.toml [workspace.lints.clippy]) — every member does,
# with no exceptions. Where a single target legitimately violates one, the exemption is a crate-level
# #![allow] at that target's entry point, never a hole in this table.
[lints]
workspace = true
