[workspace]
resolver = "2"
members = [
  # Internal library crates (not published directly), grouped by ROLE — this is not a topological order
  # and nothing should read it as one (`facade` sits above `config` yet is listed first; `engine` above
  # `git`/`cache` likewise). Cargo resolves the real dependency DAG from each crate's own manifest.
  # Roles: core/metrics/engine/git/cache are the analysis engine, `facade` is its JSON+meaning contract
  # layer, `config` owns config and request assembly, and `summary` is the host-shared answer layer BOTH
  # products below call.
  "crates/core",
  "crates/metrics",
  "crates/engine",
  "crates/git",
  "crates/cache",
  "crates/facade",
  "crates/config",
  "crates/summary",

  # Product layer: packages/ holds everything that SHIPS, one dir per product. `packages/cli` is a
  # zero-logic npm shim (pure JS, spawns the native `zzop` binary — not a Cargo member); the two below
  # are the native binaries themselves, each its own Cargo package building exactly one [[bin]] over
  # crates/summary. `packages/mcpb` (Desktop manifest) and `packages/cli/npm/*` (platform
  # sub-packages) are npm/manifest-only, likewise not Cargo members. The napi addon (`@zzop/native`,
  # formerly `packages/native`) was removed 2026-07-23 — nothing in the distribution used it.
  "packages/cli-bin", # -> zzop[.exe]     (CLI argv dispatch + CLI helpers)
  "packages/mcp",     # -> zzop-mcp[.exe] (stdio loop + server/resources + MCP tool schemas)

  # Parser frontends (former lang/ + dsl/, merged) — source -> Normalized AST / Common IR
  "parser/parser-typescript",
  "parser/parser-prisma",
  "parser/parser-python-3",
  "parser/parser-rust",
  "parser/parser-go",
  "parser/parser-java-21",
  "parser/parser-sql",
  "parser/parser-csharp",

  # JSP support arrives via the external-parser envelope protocol (docs/NORMALIZED_AST.md), not an
  # in-workspace crate — no placeholder crate needed (see parser/README.md).

  # Native rules — whole-graph, statically linked into the engine (composed by register_all_native)
  "rules/native/rules-graph",
  "rules/native/rules-http",
  "rules/native/rules-cross-layer",
  "rules/native/rules-schema",

  # Language/environment rule packs are declarative DSL data (rules/dsl/<pack>/<pack>.json), not crates —
  # the engine interprets them (WASM approach dropped). "rules" below is a thin test-only crate that gives
  # each pack's co-located <pack>.rs a cargo test target; it carries no rule data or interpreter logic.
  "rules",
]

[workspace.package]
# Version SSOT (2026-07-22 reform): the real release version lives here, bumped per release. CI's
# `verify-plugin-version` job (.github/workflows/prebuild.yml) VERIFIES that the release version, this
# file, `.claude-plugin/plugin.json`, `.claude-plugin/marketplace.json` and `server.json` all agree —
# a mismatch fails the run before anything is published. The MCPB manifest is NOT in that set: it is
# STAMPED from this version with `jq` at release time (`packages/mcpb/manifest.json` stays committed as
# the `0.0.0` placeholder), and a stamp cannot fail the way a verification can. `version_string()`
# / the binaries report `CARGO_PKG_VERSION` directly (no `ZZOP_RELEASE_VERSION` env). Cache-bust tokens are
# stamped with this version at their scope's last change — see the cache decision.
version = "0.28.0"
edition = "2021"
license = "MIT"

# Pin shared dependency versions here. swc version isolation: swc is pinned in
# parser/parser-typescript/Cargo.toml and confined to that crate, so an upgrade's re-verification
# scope is one crate, not the whole workspace (enforced by scripts/check-swc-isolation.sh).
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rayon = "1"
# Property testing — a DEV dependency of all eight `parser/*` frontends and of nothing else. Pinned here
# rather than eight times because eight copies of a version requirement drift; the isolation scripts
# (check-swc-isolation.sh and friends) exist for the opposite case, a dependency that must NOT spread.
# `default-features = false` drops proptest's `fork`/`timeout` support, which needs `rusty-fork` + `wait-timeout`
# and spawns a subprocess per case — the no-panic properties here run in-process, so that machinery is
# dead weight in every parser test binary.
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
